name: driver_app
description: Evide School Transport — driver attendance app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  intl: ^0.19.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/splash/

# App icon. Regenerate after changing the artwork with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # Android 8+ crops icons to a circle or squircle, so the foreground sits on
  # its own layer with room to spare.
  adaptive_icon_background: "#202B49"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

# Native splash: the logo on white, matching the parent app. Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/splash/android12_splash.png
